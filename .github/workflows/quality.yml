name: Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      convex: ${{ steps.filter.outputs.convex }}
      mobile: ${{ steps.filter.outputs.mobile }}
      web: ${{ steps.filter.outputs.web }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - "backend/api/**"
              - "docs/api-contract.md"
              - ".github/workflows/quality.yml"
            convex:
              - "backend/convex/**"
              - ".github/workflows/quality.yml"
            mobile:
              - "apps/mobile/**"
              - "docs/api-contract.md"
              - ".github/workflows/quality.yml"
            web:
              - "apps/web/**"
              - ".github/workflows/quality.yml"

  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/api/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  convex:
    needs: changes
    if: needs.changes.outputs.convex == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend/convex
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/convex/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  mobile:
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.x
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  web:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      # The Prisma client is generated into src/generated (gitignored). Typecheck needs it.
      - run: npx prisma generate
      - run: npm run typecheck
      # Lint is not run here: the old web app has 39 lint errors that predate the monorepo move.
