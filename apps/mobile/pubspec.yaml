name: opengym
description: OpenGym - a small gym and activity logger. Offline-first gym logger with an optional backend.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ">=3.6.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.2.0
  http: ^1.2.0
  dartvex: 0.3.0
  file_picker: ^8.0.0
  image_picker: ^1.1.0
  health: ^13.3.1
  record: ^7.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
